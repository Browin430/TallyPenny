include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    prefer_single_quotes: true
    unawaited_futures: false
    avoid_print: true
