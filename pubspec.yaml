name: flowmoney
description: "AI-powered personal finance manager — voice / screenshot / recurring entry with smart dedup."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  file_picker: ^12.1.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  intl: ^0.20.0
  open_filex: ^4.7.0
  path: ^1.9.0
  path_provider: ^2.1.4
  record: 5.1.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  excel: ^4.0.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# record 5.2.x 的 platform_interface(1.5+) 与 record_linux 0.7.x 接口不兼容，锁回兼容组合
dependency_overrides:
  record_platform_interface: 1.3.0
  record_linux:
    path: packages/record_linux_stub
